# Disposable integration environment; use project name tpm-fix-regression.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tpm_test
      POSTGRES_USER: tpm
      POSTGRES_PASSWORD: regression-only-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tpm -d tpm_test']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tpm_test
      DB_USER: tpm
      DB_PASSWORD: regression-only-password
      JWT_SECRET: regression-only-secret-at-least-32-bytes
      TENGINE_CONF_DIR: /etc/tengine/conf.d
      SETUP_KEY_PATH: /app/data/setup.key
    volumes:
      - config:/etc/tengine
      - certs:/etc/letsencrypt
      - setup:/app/data
    ports: ['127.0.0.1::4000']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, '-q', '--spider', 'http://127.0.0.1:4000/api/v1/setup/status']
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    ports: ['127.0.0.1::80']
    depends_on: [backend]
  tengine:
    build: ./docker/tengine
    volumes:
      - config:/etc/tengine
      - certs:/etc/letsencrypt:ro
    ports: ['127.0.0.1::80']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  config:
  certs:
  setup:
